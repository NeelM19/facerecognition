name: facerecognition
description: "On-device face recognition attendance app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  face_detection_tflite: ^6.10.1
  camera: ^0.12.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
